# Build and publish one waveterm-zh installer per desktop platform.
# macOS: Apple Silicon DMG; Windows: x64 NSIS; Linux: x64 AppImage.
# Unsigned builds - no upstream code-signing secrets required.

name: Release zh-CN Build
run-name: Release zh ${{ github.event.inputs.tag }}

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag (e.g. v0.14.5-zh.5)"
                required: true
                default: "v0.14.5-zh.5"
            publish:
                description: "Publish release (false = draft)"
                required: false
                default: "true"
                type: choice
                options:
                    - "true"
                    - "false"

env:
    GO_VERSION: "1.25.6"
    NODE_VERSION: "22"
    NODE_OPTIONS: --max-old-space-size=4096
    CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
    build-app:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: darwin
                      runner: macos-latest
                      artifact-name: macos-arm64-dmg
                      artifact-path: make/*.dmg
                    - platform: linux
                      runner: ubuntu-latest
                      artifact-name: linux-x64-appimage
                      artifact-path: make/*.AppImage
                    - platform: windows
                      runner: windows-latest
                      artifact-name: windows-x64-nsis
                      artifact-path: make/*.exe
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v6

            - name: Install Linux build dependencies
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y libarchive-tools libopenjp2-tools squashfs-tools

            - name: Install Zig (Linux and Windows)
              if: matrix.platform != 'darwin'
              uses: mlugg/setup-zig@v2

            - uses: actions/setup-go@v6
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: go.sum

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Force git deps to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:

            - name: npm ci
              run: npm ci --no-audit --no-fund
              env:
                  GIT_ASKPASS: echo
                  GIT_TERMINAL_PROMPT: "0"

            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Build AppImage (Linux x64)
              if: matrix.platform == 'linux'
              run: task package -- --linux AppImage --x64
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"

            - name: Build DMG (macOS arm64)
              if: matrix.platform == 'darwin'
              run: task package -- --mac dmg --arm64
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"

            - name: Build NSIS installer (Windows x64)
              if: matrix.platform == 'windows'
              run: task package -- --win nsis --x64
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"

            - name: Upload build artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: ${{ matrix.artifact-name }}
                  path: ${{ matrix.artifact-path }}
                  if-no-files-found: error
                  retention-days: 14

    create-release:
        runs-on: ubuntu-latest
        needs: build-app
        # A release must contain one installer for every supported desktop platform.
        if: ${{ !cancelled() && needs.build-app.result == 'success' }}
        permissions:
            contents: write
        steps:
            - name: Resolve release tag
              id: tag
              run: echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

            - name: Download all platform artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: false

            - name: Prepare release files
              run: |
                  mkdir -p release-files
                  find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \) \
                    -exec cp -f -t release-files {} +

                  echo "Release files:"
                  find release-files -maxdepth 1 -type f | sort

                  assert_one() {
                    pattern="$1"
                    label="$2"
                    count=$(find release-files -maxdepth 1 -type f -name "$pattern" | wc -l)
                    if [ "$count" -ne 1 ]; then
                      echo "Expected exactly one $label ($pattern), found $count"
                      exit 1
                    fi
                  }

                  assert_one '*.dmg' 'macOS DMG'
                  assert_one '*.exe' 'Windows NSIS installer'
                  assert_one '*.AppImage' 'Linux AppImage'

                  total=$(find release-files -maxdepth 1 -type f | wc -l)
                  if [ "$total" -ne 3 ]; then
                    echo "Expected exactly three release files, found $total"
                    exit 1
                  fi

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.value }}
                  name: waveterm-zh ${{ steps.tag.outputs.value }}
                  body: |
                      Simplified Chinese localization build (waveterm-zh).

                      **Unofficial fork** — not affiliated with [waveterm.dev](https://www.waveterm.dev).

                      ### Packages
                      - **macOS**: Apple Silicon DMG (`arm64`)
                      - **Windows**: x64 NSIS installer (`.exe`)
                      - **Linux**: x64 AppImage

                      Unsigned builds for community distribution.
                  draft: ${{ github.event.inputs.publish == 'false' }}
                  prerelease: false
                  generate_release_notes: false
                  target_commitish: ${{ github.sha }}
                  fail_on_unmatched_files: true
                  files: release-files/*
